name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/ci-cd.yml"
      - "compiler/**"
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - "vite.config.ts"
      - "firebase.json"
      - "index.html"
      - "load_env.sh"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/ci-cd.yml"
      - "compiler/**"
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - "vite.config.ts"
      - "firebase.json"
      - "index.html"
      - "load_env.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

      - name: Run Rust tests
      
        run: cargo test --all-features --verbose

  frontend-build:
    name: Build WASM + frontend
    runs-on: ubuntu-latest
    needs: rust-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build parser grammar
        run: yarn build:grammar

      - name: Build WASM module
        run: yarn build:wasm

      - name: Build frontend
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-firebase:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOST_PIXELS_PROD }}
          projectId: lost-pixels-prod
          target: ${{ github.ref == 'refs/heads/main' && 'mastermind-prod' || 'mastermind-staging' }}
          channelId: live